# Correcting the name must re-ask the name, not the phone number — and the next
# read-back must still carry both.
#
# From a phone test: told "名前が違います", the bot asked for the phone number
# again, and the read-back after the correction dropped the name. Later it would
# read back and record in the same turn, giving the caller no chance to object —
# which is why the read-back is now spoken by the bot and the confirmation is a
# function call.
name: callback_name_correction

judge: !include judge_text.yaml

turns:
  # Nothing is asserted about the greeting here. It is a fixed line spoken as a
  # tts_say pre-action, and a text-mode run cannot see it: the harness drops
  # bot-tts-text unless the bot is really speaking. Its wording is pinned in
  # tests/test_greeting.py, and greeting_not_interrupted_audio covers it being
  # spoken in full over a caller who starts early.
  - user: "折り返しの連絡をお願いしたいんですけど"
    expect:
      - event: response
        eval: "お名前を尋ねている"

  - user: "佐藤と申します"
    expect:
      - event: response
        eval: "お電話番号を尋ねている"

  # Both details are in hand, so they go to confirm_callback and the bot reads
  # them back itself. The read-back is a tts_say pre-action, which a text-mode
  # run cannot see — its wording is pinned in tests/test_read_back.py instead.
  # What matters here is that nothing is recorded yet.
  - user: "ゼロ八ゼロ一二三四五六七八です"
    expect:
      - event: function_call
        calls:
          - name: confirm_callback
            args: { name: "佐藤", phone_number: "08012345678" }

  # The name was wrong, not the number: only the name is asked for again.
  #
  # Sent after a pause: the turn above is satisfied by a function call alone, so
  # the harness would otherwise speak over the transition it triggered, before
  # the read-back has been said. A caller answers the read-back, not the silence
  # before it.
  - user: "すみません、名前が違います"
    send_after:
      delay_ms: 3000
    expect:
      - event: function_call
        calls:
          - name: correct_name
      - event: response
        text_contains: "お名前"

  # The corrected name goes back through the same read-back, carrying the number
  # that was never re-asked — and then the bot waits. It cannot do otherwise now:
  # the read-back is a pre-action and the node does not respond on entry, so
  # there is no turn in which the model could answer its own question.
  - user: "佐藤祐希です"
    expect:
      - event: function_call
        calls:
          - name: confirm_name
            args: { name: "佐藤祐希" }
      - event: function_call
        absent: true
        within_ms: 4000

  - user: "はい、大丈夫です"
    expect:
      - event: function_call
        calls:
          - name: record_callback
      - event: response
        text_contains: "さくら歯科クリニックにお電話いただき、ありがとうございました"

# Three questions the bot cannot answer, in a row. The first should offer a
# callback; the ones after it should not keep re-offering the same thing.
#
# From a real call, where the bot asked "ご希望されますか" three times in a row
# while the caller had not once said yes — the offer stops being an offer and
# starts being a loop.
name: callback_offer_not_repeated

judge: !include judge_text.yaml

turns:
  # Nothing is asserted about the greeting here. It is a fixed line the bot
  # speaks itself, and a text-mode run cannot see it: the harness drops
  # bot-tts-text unless the bot is really speaking. Its wording is pinned in
  # tests/test_greeting.py, and greeting_not_interrupted_audio covers it being
  # spoken in full over a caller who starts early.
  - user: "予約を取りたいんですけど"
    expect:
      - event: response
        text_contains: "いかがなさいますか"
        eval: "予約は受け付けられないと伝え、担当者からの折り返しを申し出ている"

  - user: "初診だといくらくらいかかりますか"
    expect:
      - event: response
        eval: >-
          料金には答えていない。「いかがなさいますか」と折り返しの希望をもう一度尋ね直してはいない。

  - user: "今ここで予約はできないんですかね"
    expect:
      - event: response
        eval: >-
          この電話では予約できないことを伝えている。
          「いかがなさいますか」と折り返しの希望をもう一度尋ね直してはいない。

# The callback request reaches record_callback, with the details the caller gave.
#
# The point of the scenario is the tool call, so it is asserted on the call
# itself rather than on anything the bot says about it.
name: callback_saved

judge: !include judge_text.yaml

turns:
  - expect:
      - event: response
        eval: "さくら歯科クリニックと名乗って挨拶し、用件を尋ねている"

  - user: "折り返しの連絡をお願いしたいんですけど"
    expect:
      - event: response
        eval: "お名前を尋ねている"

  - user: "佐藤祐希と申します"
    expect:
      - event: response
        eval: "お電話番号を尋ねている"

  # The details enter the flow here, and are compared literally: args is a subset
  # check against the call's own arguments. The read-back that follows is spoken
  # by the bot as a tts_say pre-action, which a text-mode run cannot observe —
  # its wording is pinned in tests/test_read_back.py.
  - user: "ゼロ八ゼロ一二三四五六七八です"
    expect:
      - event: function_call
        calls:
          - name: confirm_callback
            args: { name: "佐藤祐希", phone_number: "08012345678" }

  # After a pause, as a caller answering the read-back would. The turn above is
  # satisfied by a function call alone, so without this the harness speaks over
  # the transition it triggered.
  - user: "はい、大丈夫です"
    send_after:
      delay_ms: 3000
    expect:
      # record_callback takes no arguments: it writes down what was read back,
      # straight from the flow's state.
      - event: function_call
        calls:
          - name: record_callback
      # The closing line, and only the closing line: a phone test caught
      # "はい、ありがとうございます。" being tacked on in front of it.
      - event: response
        text_contains: "さくら歯科クリニックにお電話いただき、ありがとうございました"
        # Phrased as "what does the reply start with", because the closing line
        # itself contains ありがとうございました: asked whether a thank-you was
        # added before the closing, the judge said yes about a reply that was
        # nothing but the closing line.
        eval: "返答が「さくら歯科クリニックに」で始まっている"

# The four topics the bot exists to answer. Narrowing the refusals is what puts
# these at risk, so they are asserted as their own scenario.
name: in_scope_answers

judge: !include judge_text.yaml

turns:
  # Nothing is asserted about the greeting here. It is a fixed line spoken as a
  # tts_say pre-action, and a text-mode run cannot see it: the harness drops
  # bot-tts-text unless the bot is really speaking. Its wording is pinned in
  # tests/test_greeting.py, and greeting_not_interrupted_audio covers it being
  # spoken in full over a caller who starts early.
  - user: "何時までやってますか"
    expect:
      - event: response
        eval: "平日は午後6時まで、土曜は午後1時までという趣旨を答えている。断っていない"

  - user: "日曜はやってますか"
    expect:
      - event: response
        eval: "日曜は診療していないと答えている"

  - user: "場所はどこですか"
    expect:
      - event: response
        eval: "東京都調布市小島町1丁目2番3号、さくらビル2階という住所を答えている。断っていない"

  - user: "駅から何分くらいですか"
    expect:
      - event: response
        eval: "京王線の調布駅中央口から徒歩5分という趣旨を答えている。断っていない"

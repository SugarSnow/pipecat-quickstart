# Don't talk over a caller who is still reading out their number.
#
# Whether a finished number has the right number of digits is counted in code
# and covered by phone_number_digit_count.yaml. What is left here is the other
# half: a number that is plainly still coming gets an acknowledgement, not a
# read-back and not a guess at the rest.
name: phone_number_no_completion

judge: !include judge_text.yaml

turns:
  - expect:
      - event: response
        eval: "さくら歯科クリニックと名乗って挨拶し、用件を尋ねている"

  - user: "折り返しお願いします"
    expect:
      - event: response
        eval: "お名前を尋ねている。電話番号は同じ返答では尋ねていない"

  - user: "佐藤です"
    expect:
      - event: response
        eval: "お電話番号を尋ねている"

  # Cut off mid-sentence ("ゼロハチゼロの"): 3 digits so far, and the caller is
  # clearly still talking — acknowledge and wait, don't read anything back.
  - user: "ゼロ八ゼロの"
    expect:
      - event: response
        eval: >-
          相槌だけを打って続きを待っている。電話番号を復唱しておらず、
          聞き取れていない桁を補った番号も述べていない。

# A number that cannot be right is asked for again, not read back.
#
# From a phone test: the bot accepted a 10-digit number beginning 080 and wrote
# it down. Counting is now done in code — a mobile prefix needs 11 digits — so
# the run goes through confirm_callback and comes back out asking for the number
# again, without a read-back.
name: phone_number_digit_count

judge: !include judge_text.yaml

turns:
  # Nothing is asserted about the greeting here. It is a fixed line spoken as a
  # tts_say pre-action, and a text-mode run cannot see it: the harness drops
  # bot-tts-text unless the bot is really speaking. Its wording is pinned in
  # tests/test_greeting.py, and greeting_not_interrupted_audio covers it being
  # spoken in full over a caller who starts early.
  - user: "折り返しの連絡をお願いしたいんですけど"
    expect:
      - event: response
        eval: "お名前を尋ねている"

  - user: "佐藤と申します"
    expect:
      - event: response
        eval: "お電話番号を尋ねている"

  # 0801234567 — a mobile prefix with only 10 digits. The details still reach
  # confirm_callback; what the code does with them is the point. The digits
  # themselves are not asserted — the model writes them as "0801234567" or
  # "080-1234-567" from one run to the next — and they do not need to be: the
  # absent check below is what shows the count was rejected.
  # "以上です" so that "finished speaking" is not a judgement call: the model
  # otherwise sometimes holds a short number back instead of passing it on.
  - user: "ゼロ八ゼロ、一二三四、五六七です。以上です"
    expect:
      - event: function_call
        calls:
          - name: confirm_callback
      # Nothing is read back and nothing is recorded: the re-ask line is spoken
      # as a tts_say pre-action (invisible to a text-mode run) and the node waits.
      - event: function_call
        absent: true
        within_ms: 4000

  # Read out in pieces after the re-ask, the way someone reads a number off a
  # screen. Each piece reaches confirm_phone_number and the flow decides what to
  # do with it; what it says back is a fixed line, so it is checked in
  # tests/test_confirm_routing.py rather than here. What this turn shows is that
  # the pieces accumulate instead of resetting the collection.
  # No expectations on the pieces themselves. A piece either reaches
  # confirm_phone_number, where the flow answers "はい" and waits, or the model
  # holds it back and says as much itself — the caller hears the same thing
  # either way, so asserting one of the two would only be asserting which path
  # the model happened to take. The flow's side of it is checked in
  # tests/test_confirm_routing.py.
  - user: "ゼロ八ゼロ"
    send_after:
      delay_ms: 3000

  - user: "一二三四の"
    send_after:
      delay_ms: 2000

  # Finished this time, and the digits add up. The call is asserted, its
  # arguments are not: the model passes the new piece ("5678") on some runs and
  # the whole number so far ("08012345678") on others, and the flow merges the
  # two into the same thing. Pinning one of them here only pins which habit the
  # model happened to have — the number the flow actually assembles is checked
  # in tests/test_confirm_routing.py.
  - user: "五六七八です"
    send_after:
      delay_ms: 2000
    expect:
      - event: function_call
        calls:
          - name: confirm_phone_number
      - event: function_call
        absent: true
        within_ms: 4000

  - user: "はい、大丈夫です"
    expect:
      - event: function_call
        calls:
          - name: record_callback
      - event: response
        text_contains: "さくら歯科クリニックにお電話いただき、ありがとうございました"
